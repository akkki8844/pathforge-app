name: Build & release desktop installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    # A macOS app can only be produced on a macOS runner — the .app bundle, the
    # .icns, the DMG and (when signing is configured) codesign/notarytool all
    # need the real toolchain. So the release fans out by platform and both
    # halves publish into the same GitHub Release for the tag.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: --win
          - os: macos-latest
            platform: --mac

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run build:web

      - name: Build and publish installers
        shell: bash
        run: |
          # GitHub Actions substitutes a missing secret as an empty string, and
          # it still *defines* the variable. electron-builder reads a defined
          # CSC_LINK as a path to a certificate, resolves "" against the
          # workspace, and dies with "<workspace> not a file" — which is what
          # broke the first macOS build. Drop anything blank so an unsigned
          # build takes the unsigned path instead of a half-configured one.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          if [ -z "${CSC_LINK:-}" ]; then
            # Without this, electron-builder hunts the runner keychain for a
            # Developer ID and fails differently when it finds nothing.
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder ${{ matrix.platform }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple signing + notarization. All five are optional: with none of
          # them set, electron-builder skips signing and still produces a
          # working DMG — one that Gatekeeper will quarantine, and that
          # electron-updater will refuse to auto-install, because macOS only
          # accepts updates from a signed app. Add the secrets to turn both on.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
