    <script>
      // Redirect www subdomain to root domain (once SSL is provisioned for www)
      (function () {
        try {
          if (location.hostname === 'www.pathforge.co.in') {
            location.replace('https://pathforge.co.in' + location.pathname + location.search + location.hash);

        } catch (e) {}
      })();
    </script>
